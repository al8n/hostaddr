name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag to validate against the package version
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-and-dry-run:
    name: validate and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${package_version}"
          elif [ -n "${RELEASE_TAG}" ]; then
            test "${RELEASE_TAG}" = "v${package_version}"
          fi
      - name: Validate package with cargo publish dry run
        run: cargo publish --dry-run --all-features

  publish:
    name: Publish crate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Verify release tag matches package version
        run: |
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish hostaddr
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
